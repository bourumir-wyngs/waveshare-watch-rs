[package]
name = "waveshare-watch-rs"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []

# Convenience feature for a full app launcher build.
apps = [
    "snake",
    "game-2048",
    "tetris",
    "flappy",
    "maze",
    "settings",
    "mp3-player",
    "smart-home",
]

# App features. Enabling any app also enables the launcher UI.
app-launcher = []
snake = ["app-launcher"]
game-2048 = ["app-launcher"]
tetris = ["app-launcher"]
flappy = ["app-launcher"]
maze = ["app-launcher"]
settings = ["app-launcher"]
mp3-player = ["app-launcher", "sdcard", "dep:nanomp3"]
smart-home = ["app-launcher", "http"]

# Optional peripheral/helper features.
audio = []
sdcard = ["dep:embedded-sdmmc"]
http = []
ble = ["dep:embedded-io", "esp-radio/ble", "esp-radio/coex"]

[dependencies]
# ESP HAL + Runtime
esp-hal = { version = "1.0.0", default-features = true, features = ["esp32s3", "unstable", "psram"] }
esp-rtos = { version = "0.2.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-alloc = "0.9.0"
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
log = "0.4"

# Embassy async runtime
embassy-executor = "0.9.0"
embassy-time = "0.5.1"
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1"

# Graphics
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"

# HAL traits
embedded-hal = "1.0"
embedded-hal-bus = "0.3"

# WiFi / Networking
esp-radio = { version = "0.17.0", features = ["esp32s3", "wifi", "unstable", "log-04"] }
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }

# Peripheral drivers
axp2101-embedded = "0.3"
embedded-sdmmc = { version = "0.8", optional = true }
embedded-io = { version = "0.6", optional = true }
embedded-io-async = { version = "0.6", optional = true }

# MP3 decoding
nanomp3 = { version = "0.1", optional = true }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
